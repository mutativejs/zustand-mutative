name: Publish Package to npmjs
on:
  release:
    types: [created]
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # No registry-url: the .npmrc that it writes reads NODE_AUTH_TOKEN, which
      # trusted publishing leaves unset, and Yarn 1 fails on an unset variable
      # there. npm publish gets its token from OIDC for the default registry.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
      - run: yarn test:production
      - run: yarn test:dist
      - run: npm publish
        env:
          CI: true
